# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    paths-ignore:
      - 'images/**'
      - 'docs/**'
      - 'packages/**'
      - 'README.md'
    branches: [ master, main ]
  pull_request:
    paths-ignore:
      - 'images/**'
      - 'docs/**'
      - 'packages/**'
      - 'README.md'
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_DISABLE_GUI_ERRORS: 1
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 0
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      BusinessIntegrationServices__ApiKey: ${{ secrets.DEVOPS_TEST_APIKEY }}
      BusinessIntegrationServices__ClientSecret: ${{ secrets.DEVOPS_TEST_APISECRET }}
      PROJECTS_LIST: >-
        tests/TBC.OpenAPI.SDK.BusinessIntegrationServices.Tests/TBC.OpenAPI.SDK.BusinessIntegrationServices.Tests.csproj
        examples/ApiAppExample/ApiAppExample.csproj
        examples/ConsoleAppExample/ConsoleAppExample.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        include-prerelease: false

    - name: Restore
      run: |
        for project in $PROJECTS_LIST; do
          dotnet restore "$project" -p:Configuration=Release
        done

    - name: Build
      run: |
        for project in $PROJECTS_LIST; do
          dotnet build "$project" -c Release --no-restore -p:SourceRevisionId=$(git rev-parse --short $GITHUB_SHA)
        done

    - name: Test
      run: dotnet test tests/TBC.OpenAPI.SDK.BusinessIntegrationServices.Tests/TBC.OpenAPI.SDK.BusinessIntegrationServices.Tests.csproj -c Release --no-restore --no-build --verbosity normal

  build-windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        include-prerelease: false

    - name: Restore
      run: dotnet restore examples/WinFormsAppExample/WinFormsAppExample.csproj -p:Configuration=Release

    - name: Build
      run: dotnet build examples/WinFormsAppExample/WinFormsAppExample.csproj -c Release --no-restore
