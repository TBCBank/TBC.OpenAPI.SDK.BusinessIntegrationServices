# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "CodeQL"

on:
  push:
    paths:
      - '**.cs'
      - '**.csproj'
    branches: [ master, main ]
  pull_request:
    paths:
      - '**.cs'
      - '**.csproj'
    # The branches below must be a subset of the branches above
    branches: [ master, main ]
  schedule:
    - cron: '32 11 * * 3'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_DISABLE_GUI_ERRORS: 1
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 0
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      PROJECTS_LIST: >-
        tests/TBC.OpenAPI.SDK.BusinessIntegrationServices.Tests/TBC.OpenAPI.SDK.BusinessIntegrationServices.Tests.csproj
        examples/ApiAppExample/ApiAppExample.csproj
        examples/ConsoleAppExample/ConsoleAppExample.csproj
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        include-prerelease: false

    - name: Restore
      run: |
        for project in $PROJECTS_LIST; do
          dotnet restore "$project"
        done

    - name: Build
      run: |
        for project in $PROJECTS_LIST; do
          dotnet build "$project" -c Release --no-restore
        done

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
